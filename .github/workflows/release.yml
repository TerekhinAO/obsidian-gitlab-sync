name: Release plugin

on:
  push:
    tags:
      - "[0-9].[0-9]+.[0-9]+*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install -g pnpm@latest-10
          pnpm install --frozen-lockfile
          pnpm build

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/obsidian-plugin/gitlab-gitless-sync/main.js
            dist/obsidian-plugin/gitlab-gitless-sync/manifest.json
            dist/obsidian-plugin/gitlab-gitless-sync/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == *-beta* ]]; then
            gh release create "${{ github.ref_name }}" \
              --title="${{ github.ref_name }}" \
              --notes-file .github/release-notes.md \
              --prerelease \
              dist/obsidian-plugin/gitlab-gitless-sync/main.js \
              dist/obsidian-plugin/gitlab-gitless-sync/manifest.json \
              dist/obsidian-plugin/gitlab-gitless-sync/styles.css
          else
            gh release create "${{ github.ref_name }}" \
              --title="${{ github.ref_name }}" \
              --notes-file .github/release-notes.md \
              dist/obsidian-plugin/gitlab-gitless-sync/main.js \
              dist/obsidian-plugin/gitlab-gitless-sync/manifest.json \
              dist/obsidian-plugin/gitlab-gitless-sync/styles.css
          fi
