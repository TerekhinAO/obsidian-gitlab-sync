name: Release plugin

on:
  push:
    tags:
      - "[0-9].[0-9]+.[0-9]+*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install -g pnpm@latest-10
          pnpm install --frozen-lockfile
          pnpm build

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/obsidian-plugin/gitlab-gitless-sync/main.js
            dist/obsidian-plugin/gitlab-gitless-sync/manifest.json
            dist/obsidian-plugin/gitlab-gitless-sync/styles.css

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          assets=(
            dist/obsidian-plugin/gitlab-gitless-sync/main.js
            dist/obsidian-plugin/gitlab-gitless-sync/manifest.json
            dist/obsidian-plugin/gitlab-gitless-sync/styles.css
          )
          flags=()

          if [[ "$tag" == *-beta* ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title="$tag" \
              --notes-file .github/release-notes.md \
              "${flags[@]}"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --notes-file .github/release-notes.md \
              "${flags[@]}" \
              "${assets[@]}"
          fi
